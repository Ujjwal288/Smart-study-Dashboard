<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Study Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header>
        <h1>Smart Study Dashboard</h1>
        <p>Organize your learning. Track your progress.</p>
    </header>

    <div class="card">
        <div class="input-row">
            <input type="text" id="taskInput" placeholder="What do you want to study?">
            <input type="date" id="dateInput">
            <select id="priorityInput">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>
            <button onclick="addTask()">Add</button>
        </div>

        <div class="progress-section">
            <span id="progressText">0% Completed</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <ul id="taskList"></ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
